name: Platform CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  OPENAI_API_KEY: ""
  STARTUP_VALIDATION_STRICT: "false"
  AUTH_ADMIN_PASSWORD: "ci-admin-password"
  AUTH_ANALYST_PASSWORD: "ci-analyst-password"
  AUTH_VIEWER_PASSWORD: "ci-viewer-password"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Ruff
        run: python -m ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Pytest
        run: python -m pytest

      - name: Upload pytest cache diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: .pytest_cache
          if-no-files-found: ignore

  startup:
    name: Startup Validation
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Runtime startup validation
        run: python -m backend.startup

      - name: FastAPI startup probe
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from backend.main import app

          with TestClient(app) as client:
              health = client.get("/health")
              login = client.post("/auth/login", json={
                  "username": "admin", "password": os.environ["AUTH_ADMIN_PASSWORD"]
              })
              assert login.status_code == 200, login.text
              token = login.json()["session"]["session_token"]
              diagnostics = client.get("/diagnostics", headers={"X-Session-Token": token})
              assert health.status_code == 200, health.text
              assert health.json()["status"] == "ok"
              assert diagnostics.status_code == 200, diagnostics.text
              assert "startup" in diagnostics.json()
          PY

      - name: Streamlit startup probe
        shell: bash
        run: |
          python -m streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            --browser.gatherUsageStats false > streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              kill "$STREAMLIT_PID"
              wait "$STREAMLIT_PID" || true
              exit 0
            fi
            if ! kill -0 "$STREAMLIT_PID" 2>/dev/null; then
              cat streamlit.log
              exit 1
            fi
            sleep 1
          done
          cat streamlit.log
          kill "$STREAMLIT_PID" || true
          exit 1

      - name: Upload Streamlit logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-startup-log
          path: streamlit.log
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m playwright install --with-deps chromium

      - name: Run Playwright E2E
        env:
          RUN_E2E: "1"
          E2E_HEADLESS: "true"
          E2E_ADMIN_PASSWORD: ${{ env.AUTH_ADMIN_PASSWORD }}
          AUTH_ADMIN_PASSWORD: ${{ env.AUTH_ADMIN_PASSWORD }}
          AUTH_ANALYST_PASSWORD: ${{ env.AUTH_ANALYST_PASSWORD }}
          AUTH_VIEWER_PASSWORD: ${{ env.AUTH_VIEWER_PASSWORD }}
          OPENAI_API_KEY: ""
        run: python -m pytest tests/e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/playwright
          if-no-files-found: ignore

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          load: true
          tags: agentic-analytics-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: agentic-analytics-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare isolated stack credentials
        run: python ops/stack_smoke.py prepare

      - name: Start complete stack
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Verify authentication, persistence, and worker failure handling
        run: python ops/stack_smoke.py verify

      - name: Stack diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Stop stack
        if: always()
        run: docker compose down -v

  persistence-services:
    name: PostgreSQL and pgvector
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: analytics_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: analytics_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_test -d analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_SERVICE_TESTS: "1"
      TEST_POSTGRES_URL: postgresql://analytics_test:isolated-ci-password@localhost:5432/analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Set PostgreSQL client tools
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Enable vector extension
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["TEST_POSTGRES_URL"]) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
      - name: Verify real database round trips, isolation, and worker leases
        run: python -m pytest tests/integration -v

  deployment-safety:
    name: Deployment Safety
    runs-on: ubuntu-latest
    needs: [startup, docker, e2e, persistence-services]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          test -f Dockerfile.backend
          test -f Dockerfile.frontend
          test -f docker-compose.yml
          test -f .env.example
          grep -q "OPENAI_API_KEY" .env.example
          grep -q "WORKFLOW_DATABASE_URL" .env.example
