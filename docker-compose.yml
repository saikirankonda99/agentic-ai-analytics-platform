x-app: &app
  image: agentic-analytics-backend:latest
  build:
    context: .
    dockerfile: Dockerfile.backend
  env_file: [.env]
  environment: &app-environment
    APP_ENV: production
    DATABASE_URL: postgresql://analytics:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}@postgres:5432/analytics
    WORKFLOW_DATABASE_URL: postgresql://analytics:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/analytics
    POSTGRES_URL: ""
    VECTOR_DATABASE_URL: ""
    ANALYTICS_WORKER_MODE: external
    STARTUP_VALIDATION_STRICT: "true"
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  backend:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]

  frontend:
    <<: *app
    image: agentic-analytics-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      <<: *app-environment
      BACKEND_HTTP_URL: http://backend:8000
      BACKEND_WS_URL: ws://backend:8000
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      backend:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "backend.workers"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  maintenance:
    <<: *app
    command: ["python", "-m", "backend.maintenance", "--interval", "3600"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: analytics
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
